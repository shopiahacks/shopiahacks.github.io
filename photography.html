<!-- how to add a photo: copy one <figure> line, change the src, alt text, caption, and tags.
     tags: "picks" shows it under my picks. add any category tag too: graduation, nature, sports.
     to add a new category: add a button above with data-filter="newtag" and use "newtag" in the photos' tags. -->
<div class="gallery">
<figure data-tags="picks graduation"><img src="images/placeholder.svg" alt="describe this photo" loading="lazy"><figcaption>graduation photo (also in my picks)</figcaption></figure>
<figure data-tags="picks nature"><img src="images/placeholder.svg" alt="describe this photo" loading="lazy"><figcaption>nature photo (also in my picks)</figcaption></figure>
